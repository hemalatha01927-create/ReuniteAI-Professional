{% extends "layout.html" %}{% block content %}<div class="page-header"><div><span class="eyebrow">ACCOUNT SETTINGS</span><h1>My profile</h1><p>Manage your contact details and account password.</p></div></div><div class="settings-grid"><section class="panel"><div class="panel-head"><div><h3>Personal information</h3><p>Keep your account details up to date.</p></div></div><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="full_name" required maxlength="100" value="{{ current_user.full_name }}"></label><label>Email address<input value="{{ current_user.email }}" disabled><small>Email change is disabled in this release.</small></label><label>Phone number<input name="phone" maxlength="30" value="{{ current_user.phone or '' }}"></label><button class="btn btn-primary">Save profile</button></form></section><section class="panel"><div class="panel-head"><div><h3>Change password</h3><p>Use a long, unique passphrase.</p></div></div><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="full_name" value="{{ current_user.full_name }}"><input type="hidden" name="phone" value="{{ current_user.phone or '' }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password"></label><label>New password<input type="password" name="new_password" minlength="12" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm_password" minlength="12" autocomplete="new-password"></label><button class="btn btn-dark">Update password</button></form></section></div>{% endblock %}
