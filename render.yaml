services:
  - type: web
    name: reuniteai-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py init-db && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "false"
      - key: PUBLIC_INTAKE_ENABLED
        value: "false"
      - key: UPLOADS_ENABLED
        value: "false"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
